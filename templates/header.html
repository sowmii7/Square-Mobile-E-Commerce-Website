<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Square – The Ultimate eCommerce Mobile Platform</title>
  <!--favicon-->
	<link rel="icon" href="../assets/images/favicon.png" type="image/png">
  <!--font-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <!--Plugins-->
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="../assets/plugins/swiper/css/swiper-bundle.min.css">

  <!--Bootstrap files-->
  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/bootstrap-icons.min.css">
  <!--main style sheet-->
  <link href="/assets/sass/style.css" rel="stylesheet">

</head>

<body>

  <!--start header-->
  <header class="top-header py-2">
    <div class="top-strip d-flex align-items-center gap-4 container px-3">
      <div class="strip-social-links ms-lg-auto flex-lg-grow-0 flex-grow-1">
        <ul class="nav align-items-center gap-2">
          <li class="nav-item">
            <a class="nav-link" href="javascript:;"><i class="bi bi-facebook"></i></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="javascript:;"><i class="bi bi-twitter-x"></i></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="javascript:;"><i class="bi bi-linkedin"></i></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="javascript:;"><i class="bi bi-pinterest"></i></a>
          </li>
        </ul>
      </div>
      <div class="dropdown language">
        <a class="btn btn-sm btn-language btn-outline-light border-0 d-flex align-items-center gap-2 px-2 dropdown-toggle dropdown-toggle-nocaret"
          href="javascript:;" data-bs-toggle="dropdown">
          <span>English</span><span><i class="bi bi-chevron-down"></i></span>
        </a>
      </div>
      <div class="dropdown language">
        <a class="btn btn-sm btn-language btn-outline-light border-0 d-flex align-items-center gap-2 px-2 dropdown-toggle dropdown-toggle-nocaret"
          href="javascript:;" data-bs-toggle="dropdown">
          <span>INR</span><span><i class="bi bi-chevron-down"></i></span>
        </a>
      </div>
    </div>
  </header>
  <!--end header-->


  <!--start nav-->
  <nav class="navbar navbar-expand-xl border-bottom py-3">
    <div class="container px-3">
      <a class="navbar-brand d-none d-xl-flex" href="index.html">
        <img src="../assets/images/gallery/logo1.1.png" class="logo-img" alt="">
      </a>
      <button type="button" class="d-xl-none btn-menu-close" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasNavbar">
        <i class="bi bi-list"></i>
      </button>
      <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar">
        <div class="offcanvas-header">
          <img src="../assets/images/gallery/logo.png" class="logo-img2" alt="">
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="nav-search p-3 pt-0 border-bottom d-flex d-xl-none">
          <form class="position-relative w-100">
            <input type="text" class="form-control nav-search-control ps-5 border-0 py-2" placeholder="what are you looking for ?">
            <span class="position-absolute top-50 start-0 translate-middle-y"><i class="bi bi-search fs-6 ms-3"></i></span>
         </form>
        </div>
        <div class="offcanvas-body p-0">
          <ul class="navbar-nav mx-auto gap-0 gap-xl-2">
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('index')}}">
                <span class="parent-menu-name">Home</span>
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle dropdown-toggle-nocaret" href="javascript:;" data-bs-toggle="dropdown">
                <span class="parent-menu-name">Shop</span>
                <span class="parent-menu-icon ms-2"><i class="bi bi-chevron-down"></i></span>
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="{{url_for('shop_grid_categories')}}" >Categories</a></li>
              </ul>

            <li class="nav-item">
              <a class="nav-link" href="{{url_for('about')}}">
                <span class="parent-menu-name">About</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('contact')}}">
                <span class="parent-menu-name">Contact</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="right-links nav gap-2 d-flex">
        {% if wishlist_count %}
        <a class="nav-link" href="{{url_for('account_my_profile')}}"><i class="bi bi-person-circle"></i></a>
        <a class="nav-link position-relative" href="{{url_for('account_wishlist')}}"><i class="bi bi-heart"></i><span class="notify-badge">{{wishlist_count}}</span></a>
        <a class="nav-link position-relative" data-bs-toggle="offcanvas" href="#offcanvasCart"><i class="bi bi-basket2"></i><span class="notify-badge">{{cart_list_count}}</span></a>
        {% endif %}
      </div>
    </div>
  </nav>
  <!--end nav-->
